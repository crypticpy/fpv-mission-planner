name: CI

on:
  push:
  pull_request:

jobs:
  # Same job, wider gate: `npm run check` is typecheck + lint + unit/contract
  # tests + build + arch-check + browser smoke (ADR 0009). CI runs exactly the
  # command a developer runs locally — there is no CI-only step to drift.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # --with-deps only here: it installs system libraries with apt and needs
      # root, which is a runner-only concern. Locally, `npx playwright install
      # chromium` is enough.
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
